name: CI - Build and Push Docker Image

# Run this workflow whenever code is pushed to main, or on a pull request into main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only log in on pushes to main, not on pull requests from forks
        # (forks don't have access to your secrets, and that's a good thing)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t devops-assistant-bot:ci .

      - name: Confirm image was created
        run: docker images devops-assistant-bot

      - name: Tag and push image to Docker Hub
        # Only push on pushes to main - never from pull requests
        if: github.event_name == 'push'
        run: |
          docker tag devops-assistant-bot:ci ${{ secrets.DOCKERHUB_USERNAME }}/devops-assistant-bot:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/devops-assistant-bot:latest